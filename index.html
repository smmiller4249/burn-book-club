<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="referrer" content="no-referrer" />
  <title>Burn Gym Book Club Hub</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            burnBlue: '#00B1E1',
            candlelight: '#FDDA13',
            midnight: '#002063',
          }
        }
      }
    }
  </script>
  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; }
    .wheel-pointer {
      width: 0;
      height: 0;
      border-left: 14px solid transparent;
      border-right: 14px solid transparent;
      border-top: 24px solid #FDDA13;
    }
    .star-btn {
      transition: transform 0.15s ease, color 0.15s ease;
    }
    .star-btn:hover {
      transform: scale(1.2);
    }
  </style>
</head>
<body class="bg-[#00133b] text-slate-100 min-h-screen pb-20">

  <!-- Header -->
  <header class="border-b border-[#002b82] bg-midnight/80 backdrop-blur sticky top-0 z-40">
    <div class="max-w-6xl mx-auto px-4 py-4 flex flex-col sm:flex-row justify-between items-center gap-3">
      <div class="flex items-center gap-3">
        <span class="text-3xl">🔥📖</span>
        <div>
          <h1 class="text-xl font-bold tracking-tight text-white flex items-center gap-2">
            Burn Gym Book Club
          </h1>
          <p class="text-xs text-cyan-200">Sweat first, discuss plot twists second</p>
        </div>
      </div>
      <nav class="flex gap-2">
        <button onclick="switchTab('archive')" id="tab-archive" class="px-4 py-1.5 rounded-full text-sm font-semibold transition bg-burnBlue text-midnight">Past Reads</button>
        <button onclick="switchTab('recommendations')" id="tab-recommendations" class="px-4 py-1.5 rounded-full text-sm font-semibold transition bg-midnight border border-[#002b82] text-slate-300 hover:text-white">Recommendations & Wheel</button>
      </nav>
    </div>
  </header>

  <main class="max-w-6xl mx-auto px-4 pt-8">

    <!-- TAB 1: READ BOOKS ARCHIVE -->
    <section id="section-archive">
      <div class="flex flex-col sm:flex-row justify-between sm:items-center gap-4 mb-6">
        <div>
          <div class="flex items-center gap-2">
            <h2 class="text-2xl font-bold text-white">Books We've Read</h2>
            <span id="syncBadge" class="text-[11px] bg-cyan-950 text-burnBlue border border-burnBlue/40 px-2.5 py-0.5 rounded-full font-medium flex items-center gap-1.5">
              <span class="w-1.5 h-1.5 rounded-full bg-burnBlue animate-pulse"></span>
              Live Sheet Connected
            </span>
          </div>
          <p class="text-sm text-cyan-100/70">Ordered newest to oldest. Tap any star to rate!</p>
        </div>
        <div class="relative">
          <input type="text" id="archiveSearch" oninput="
